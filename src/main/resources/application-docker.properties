spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${MYSQL_DATABASE:turnera}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=${MYSQL_USER:turnera_app}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

turnera.bootstrap.admin.enabled=${TURNERA_BOOTSTRAP_ADMIN_ENABLED:false}
turnera.bootstrap.admin.dni=${TURNERA_BOOTSTRAP_ADMIN_DNI:}
turnera.bootstrap.admin.nombre=${TURNERA_BOOTSTRAP_ADMIN_NOMBRE:}
turnera.bootstrap.admin.apellido=${TURNERA_BOOTSTRAP_ADMIN_APELLIDO:}
turnera.bootstrap.admin.email=${TURNERA_BOOTSTRAP_ADMIN_EMAIL:}
turnera.bootstrap.admin.password=${TURNERA_BOOTSTRAP_ADMIN_PASSWORD:}
