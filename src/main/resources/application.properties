spring.application.name=demo
# URL de conexión a la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/turneraMySql?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Credenciales
spring.datasource.username=grupo1
spring.datasource.password=grupoUno

# Driver y Hibernate
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Clave aleatoria Base64 (al menos 32 bytes decodificados). Sin secreto por defecto.
jwt.secret=${JWT_SECRET}
# Duración del token en milisegundos: 1 hora por defecto.
jwt.expiration=${JWT_EXPIRATION:3600000}
