spring.application.name=demo
# URL de conexión a la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/turneraMySql?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Credenciales
spring.datasource.username=grupo1
spring.datasource.password=grupoUno

# Driver y Hibernate
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Bootstrap opcional del primer administrador. Mantener desactivado por defecto.
turnera.bootstrap.admin.enabled=${TURNERA_BOOTSTRAP_ADMIN_ENABLED:false}
turnera.bootstrap.admin.dni=${TURNERA_BOOTSTRAP_ADMIN_DNI:}
turnera.bootstrap.admin.nombre=${TURNERA_BOOTSTRAP_ADMIN_NOMBRE:}
turnera.bootstrap.admin.apellido=${TURNERA_BOOTSTRAP_ADMIN_APELLIDO:}
turnera.bootstrap.admin.email=${TURNERA_BOOTSTRAP_ADMIN_EMAIL:}
turnera.bootstrap.admin.password=${TURNERA_BOOTSTRAP_ADMIN_PASSWORD:}

